<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crab - Log Air</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#38bdf8',
                        danger: '#ef4444',
                        safe: '#10b981',
                        warning: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        th.sortable { cursor: pointer; user-select: none; transition: background-color 0.2s; }
        th.sortable:hover { background-color: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">

    <header class="flex flex-col md:flex-row justify-between items-center mb-8 pb-6 border-b border-slate-700">
        <div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white mb-2">
                <i class="fa-solid fa-crab text-accent mr-3"></i>SMART CRAB HOUSE
            </h1>
            <p class="text-slate-400 text-lg">Real-time Monitoring & Biomass Estimation</p>
        </div>
        <div class="mt-4 md:mt-0 flex items-center space-x-4">
            <div id="connection-status" class="flex items-center px-6 py-3 bg-slate-800 rounded-full border border-slate-600 shadow-lg transition-colors">
                <div id="connection-dot" class="w-3 h-3 rounded-full bg-warning mr-3 animate-pulse"></div>
                <span id="connection-text" class="text-sm font-bold text-slate-300">Menghubungkan ke Firebase...</span>
            </div>
        </div>
    </header>

    <!-- Navigasi Link Antar Halaman -->
    <nav class="flex flex-wrap gap-2 md:gap-4 mb-8 border-b border-slate-700/50 pb-4">
        <a href="realtime.html" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 transition-all flex items-center">
            <i class="fa-solid fa-tower-broadcast mr-2"></i> Real-time Monitoring
        </a>
        <a href="weight-log.html" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 transition-all flex items-center">
            <i class="fa-solid fa-scale-balanced mr-2"></i> Log Berat
        </a>
        <a href="water-log.html" class="px-5 py-2.5 rounded-xl bg-accent text-dark font-bold shadow-lg shadow-accent/20 transition-all flex items-center">
            <i class="fa-solid fa-water mr-2"></i> Log Air
        </a>
        <a href="prediction.html" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 transition-all flex items-center">
            <i class="fa-solid fa-brain mr-2"></i> Prediksi ML
        </a>
    </nav>

    <!-- Tabel Log Data -->
    <div class="mb-4 flex flex-col md:flex-row md:items-center justify-between">
        <h2 class="text-xl font-semibold text-slate-300 mb-2 md:mb-0"><i class="fa-solid fa-table-list text-accent mr-2"></i>Log Historis Kualitas Air</h2>
        <span class="text-sm text-slate-400 bg-slate-800 px-3 py-1 rounded-full"><i class="fa-regular fa-clock mr-1"></i> Difilter per interval 15 menit</span>
    </div>
    
    <div class="glass-panel rounded-2xl p-0 overflow-hidden mb-10">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm md:text-base text-slate-300 whitespace-nowrap">
                <thead class="bg-slate-800/80 border-b border-slate-700">
                    <tr>
                        <th class="p-4 font-semibold text-slate-200 sortable" onclick="handleSort('TimestampRaw')">
                            Waktu (Timestamp) <i id="icon-TimestampRaw" class="fa-solid fa-sort ml-1 text-slate-500"></i>
                        </th>
                        <th class="p-4 font-semibold text-accent sortable" onclick="handleSort('Temperature')">
                            Suhu (°C) <i id="icon-Temperature" class="fa-solid fa-sort ml-1 text-slate-500"></i>
                        </th>
                        <th class="p-4 font-semibold text-safe sortable" onclick="handleSort('pH')">
                            pH <i id="icon-pH" class="fa-solid fa-sort ml-1 text-slate-500"></i>
                        </th>
                        <th class="p-4 font-semibold text-danger sortable" onclick="handleSort('TDS')">
                            Salinitas (TDS) <i id="icon-TDS" class="fa-solid fa-sort ml-1 text-slate-500"></i>
                        </th>
                        <th class="p-4 font-semibold text-blue-400 sortable" onclick="handleSort('DO')">
                            DO (mg/L) <i id="icon-DO" class="fa-solid fa-sort ml-1 text-slate-500"></i>
                        </th>
                    </tr>
                </thead>
                <tbody id="water-table-body" class="divide-y divide-slate-700/50">
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-500">Memuat data histori air...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQCnN1Q0CDMN3ef-e-nKGEV-Boh6JsEQ0",
            authDomain: "crabs-wp.firebaseapp.com",
            databaseURL: "https://crabs-wp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "crabs-wp",
            storageBucket: "crabs-wp.firebasestorage.app",
            messagingSenderId: "207016258888",
            appId: "1:207016258888:web:7831a964768ba52253d77d",
            measurementId: "G-05NYPTBENS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let waterDataArr = [];
        let currentSort = { key: 'TimestampRaw', direction: 'desc' }; // Default sort by time newest

        const formatDec = (num) => Number(num).toFixed(1);
        const formatInt = (num) => Math.round(Number(num));

        // Fungsi Filter untuk membuat key interval 15 menitan (xx:00, xx:15, xx:30, xx:45)
        function get15MinIntervalKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            const h = String(dateObj.getHours()).padStart(2, '0');
            
            // Bulatkan menit ke kelipatan 15 terdekat di bawahnya
            const min = Math.floor(dateObj.getMinutes() / 15) * 15;
            const minStr = String(min).padStart(2, '0');
            
            return `${y}-${m}-${d} ${h}:${minStr}`;
        }

        // Proses Data Mentah
        function processFirebaseData(data) {
            const entries = Object.values(data);
            const groupedData = {};

            entries.forEach(row => {
                let timeStr = row.Timestamp;
                let dateObj;

                if (typeof timeStr === 'number') { 
                    dateObj = new Date(timeStr < 10000000000 ? timeStr * 1000 : timeStr); 
                } else if (typeof timeStr === 'string') {
                    const parts = timeStr.split(/[- :]/);
                    if(parts.length >= 4) { dateObj = new Date(parts[0], parts[1]-1, parts[2], parts[3], parts[4]||0); } 
                    else { dateObj = new Date(timeStr); }
                } else return;

                if (isNaN(dateObj.getTime())) return;

                // Masukkan ke dalam grup interval 15 menit
                const groupKey = get15MinIntervalKey(dateObj);
                
                // Jika interval ini belum terisi data, isi dengan data pertama yang masuk
                if (!groupedData[groupKey]) {
                    groupedData[groupKey] = {
                        TimestampRaw: dateObj.getTime(), // Dipakai khusus untuk keperluan sortir matematika
                        TimestampString: dateObj.toLocaleString('id-ID'), // Teks yang ditampilkan
                        Temperature: Number(row.Temperature || 0),
                        pH: Number(row.pH || 0),
                        TDS: Number(row.TDS || 0),
                        DO: Number(row.DO || 0)
                    };
                }
            });

            // Jadikan format array agar mudah disortir
            waterDataArr = Object.values(groupedData);
            executeSort();
        }

        // Jalankan pengurutan (Sort)
        function executeSort() {
            waterDataArr.sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];

                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });
            renderTable();
            updateSortIcons();
        }

        // Fungsi saat pengguna mengklik Header Tabel
        window.handleSort = function(key) {
            if (currentSort.key === key) {
                // Balik arah (Toggle) jika kolom yang sama diklik lagi
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                // Kolom baru dipilih, set default ke descending (tertinggi ke terendah)
                currentSort.key = key;
                currentSort.direction = 'desc';
            }
            executeSort();
        };

        // Memperbarui UI Ikon panah pada header tabel
        function updateSortIcons() {
            const keys = ['TimestampRaw', 'Temperature', 'pH', 'TDS', 'DO'];
            keys.forEach(k => {
                const iconEl = document.getElementById(`icon-${k}`);
                if (iconEl) {
                    if (k === currentSort.key) {
                        iconEl.className = currentSort.direction === 'asc' ? "fa-solid fa-sort-up ml-1 text-accent" : "fa-solid fa-sort-down ml-1 text-accent";
                    } else {
                        iconEl.className = "fa-solid fa-sort ml-1 text-slate-500";
                    }
                }
            });
        }

        // Tampilkan ke layar
        function renderTable() {
            const tbody = document.getElementById('water-table-body');
            if(!tbody) return;
            tbody.innerHTML = '';
            
            if (waterDataArr.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Belum ada data histori yang tersimpan.</td></tr>';
                return;
            }

            waterDataArr.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/30 transition-colors";
                tr.innerHTML = `
                    <td class="p-4 text-slate-400">${row.TimestampString}</td>
                    <td class="p-4 font-medium text-white">${formatDec(row.Temperature)}</td>
                    <td class="p-4 font-medium text-white">${formatDec(row.pH)}</td>
                    <td class="p-4 font-medium text-white">${formatInt(row.TDS)}</td>
                    <td class="p-4 font-medium text-white">${formatDec(row.DO)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Autentikasi dan Mengambil Data
        signInWithEmailAndPassword(auth, "crabs.wp@email.com", "crabs.wp")
            .then((userCredential) => {
                const dot = document.getElementById('connection-dot');
                const text = document.getElementById('connection-text');
                const statusBox = document.getElementById('connection-status');
                
                if(dot) dot.className = "w-3 h-3 rounded-full bg-safe mr-3 animate-ping";
                if(text) { text.textContent = "Terhubung ke Firebase"; text.classList.replace('text-slate-300', 'text-safe'); }
                if(statusBox) statusBox.classList.replace('border-slate-600', 'border-safe/50');

                // Ditingkatkan secara signifikan ke 10.000 agar data setelah difilter per 15 menit tetap banyak
                const waterRef = query(ref(db, 'log-water-db'), limitToLast(10000));
                
                onValue(waterRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) { 
                        processFirebaseData(data); 
                    } else {
                        renderTable();
                    }
                });
            })
            .catch((error) => {
                console.error("Error Firebase Auth:", error);
                const dot = document.getElementById('connection-dot');
                const text = document.getElementById('connection-text');
                const statusBox = document.getElementById('connection-status');
                if(dot) dot.className = "w-3 h-3 rounded-full bg-danger mr-3";
                if(text) { text.textContent = "Koneksi Database Gagal"; text.classList.replace('text-slate-300', 'text-danger'); }
                if(statusBox) statusBox.classList.replace('border-slate-600', 'border-danger/50');
            });
    </script>
</body>
</html>
